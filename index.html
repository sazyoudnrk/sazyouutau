<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>砂上天獄</title>
<meta name="description" content="砂上電力が、UTAU、MYCOE（ボイロのようなもの）またはその関連物を配布するためのサイトです。">
<meta property="og:title" content="砂上天獄">
<meta property="og:site_name" content="砂上天獄">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sazyoudnrk.github.io/sazyouutau/">
<meta property="og:description" content="砂上電力が、UTAU、MYCOE（ボイロのようなもの）またはその関連物を配布するためのサイトです。">
<meta property="og:image" content="https://static.wixstatic.com/media/87b28a_aed14a8bbfa34bf49c4f880f2f25e836~mv2.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://static.wixstatic.com/media/87b28a_a80b512c13f242d6826fdee97af0a04d~mv2.png/v1/crop/x_776,y_50,w_1025,h_1025/fill/w_64,h_64,al_c,q_90/i.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap">
<style>
/* 元Wixの再現: 薄グレー地・黄色ロゴ・白い四角のハンバーガー・灰色の四角ボタン・細字グレー本文 */
:root{
  --bg:#e8e6e7;        /* 地 */
  --title:#f4b232;     /* ロゴ */
  --band:#f7cd62;      /* ホームの黄色帯 */
  --text:#757575;      /* 本文（細字グレー） */
  --ink:#1f1f1f;       /* 見出し・更新履歴 */
  --red:#e8463c;       /* 砂上・電力 */
  --btn:#c6c6c6;       /* 四角ボタン */
  --btn-hover:#b3b3b3;
  --teal:#3e8796;      /* 「画像をクリックで詳細へ」 */
  --rule:#5e5e5e;
  --white:#ffffff;
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --w:880px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-weight:300;
  font-size:16px;line-height:1.75;letter-spacing:.04em;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:300;line-height:1.35}
p{margin:0}
.wrap{max-width:var(--w);margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ===== ヘッダー ===== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{color:var(--title);font-weight:700;font-size:clamp(34px,8vw,44px);letter-spacing:.02em;text-decoration:none;line-height:1}
.burger{width:64px;height:64px;background:var(--white);border:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;padding:0;flex:none}
.burger span{display:block;width:30px;height:2px;background:var(--ink)}
/* PC: 横並びメニュー */
.menu{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.menu>li{position:relative}
.menu a{display:block;padding:8px 16px;text-decoration:none;color:var(--ink);font-weight:400;font-size:15px;white-space:nowrap}
.menu a:hover,.menu a.on{color:var(--title)}
.menu .sub{list-style:none;margin:0;padding:6px 0;position:absolute;left:0;top:100%;min-width:160px;background:var(--white);display:none;
  box-shadow:0 4px 14px rgba(0,0,0,.08)}
.menu>li:hover>.sub,.menu>li:focus-within>.sub{display:block}
.burger{display:none}
@media (max-width:860px){
  .burger{display:flex}
  #nav{position:fixed;inset:0;z-index:40;background:var(--white);display:none;overflow-y:auto;
    padding:calc(90px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) 40px max(28px,env(safe-area-inset-left,0px))}
  #nav.open{display:block}
  .menu{flex-direction:column;gap:0}
  .menu a{font-size:20px;padding:10px 0}
  .menu .sub{position:static;display:block;box-shadow:none;background:none;padding:0 0 6px 20px}
  .menu .sub a{font-size:17px;color:var(--text)}
  .close{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));
    width:56px;height:56px;border:0;background:none;font-size:38px;line-height:1;color:var(--ink);cursor:pointer;font-weight:300}
}
@media (min-width:861px){.close{display:none}}

/* ===== 共通 ===== */
main{padding-bottom:80px}
.page{display:flex;flex-direction:column;gap:26px;padding-top:28px}
.ttl{font-size:clamp(36px,8vw,48px);color:var(--text);border-bottom:2px solid var(--rule);padding-bottom:4px;letter-spacing:.01em}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;max-width:520px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:8px 16px;background:var(--btn);
  color:var(--ink);text-decoration:none;font-weight:400;font-size:18px;text-align:center;transition:background .15s}
.btn:hover{background:var(--btn-hover)}
.u{text-decoration:underline;text-underline-offset:4px}
.u.blue{color:var(--teal)}
.hint{color:var(--teal);font-size:18px}
hr{border:0;border-top:2px solid var(--rule);margin:0}
.stack{display:flex;flex-direction:column;gap:2px}

/* ===== ホーム ===== */
.hero{display:flex;justify-content:center;padding-top:24px}
.hero img{width:min(480px,100%)}
.band{background:var(--band);text-align:center;padding-block:44px}
.band .wrap{display:flex;flex-direction:column;gap:36px;font-size:clamp(16px,4.2vw,19px)}
.mainlink{font-weight:700;color:var(--ink);text-decoration:none;font-size:clamp(17px,4.4vw,20px)}
.mainlink .r{color:var(--red)}
.mainlink:hover{text-decoration:underline}
.log{padding-block:40px 0;color:var(--ink);font-weight:400}
.log h2{font-size:28px;font-weight:400;margin-bottom:6px}
.log ul{list-style:none;margin:0;padding:0;font-size:clamp(16px,4.4vw,19px)}
.log time{font-variant-numeric:tabular-nums;margin-right:.6em}

/* ===== 音源カード（UTAU / MYCOE） ===== */
.vcard{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:20px 28px}
.vcard .pic{display:block;aspect-ratio:320/376;max-width:100%;overflow:hidden;background:var(--band)}
.vcard .pic img{width:100%;height:100%;object-fit:cover}
.vcard .txt{min-width:0;display:flex;flex-direction:column;gap:22px;padding-top:6px}
.vcard h2{font-size:clamp(26px,6vw,34px);text-align:center}
.vcard h2 a{text-decoration:none}
.vcard h2 a:hover{color:var(--ink)}
.vcard .listen{grid-column:1/-1}
@media (max-width:520px){.vcard{grid-template-columns:1fr 1fr;gap:18px 16px}.vcard .txt{gap:16px}.vcard .txt p{font-size:15px}}

/* 試聴 */
.listen{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,2fr);align-items:center;gap:16px}
.listen>span{font-size:22px}
.players{display:flex;flex-direction:column;gap:10px;min-width:0}
.player{background:var(--white);display:flex;align-items:center;min-height:60px;padding:6px 10px;max-width:380px}
.player audio{width:100%;height:44px}
.na{font-size:14px}

/* ===== キャラ詳細 ===== */
.char{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:start}
.char>img{justify-self:center;max-height:540px;width:auto}
.char>div{min-width:0;display:flex;flex-direction:column;gap:24px}
@media (max-width:640px){.char{grid-template-columns:1fr}.char>img{max-height:440px}}
.box h3{font-size:22px;color:var(--ink);font-weight:400;margin-bottom:4px}
.prof{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 1em}
.prof dt::after{content:"："}
.prof dd{margin:0}
.prof .gap{grid-column:1/-1;height:.8em}
.dl{display:flex;flex-direction:column;gap:28px}
.dl-item{display:flex;flex-direction:column;gap:10px}
.dl-item .btn{max-width:360px}
.back{max-width:200px}

/* ===== 規約 ===== */
.terms{display:flex;flex-direction:column;gap:22px}
.terms h2{font-size:22px;color:var(--ink);font-weight:400}
.terms h3{font-size:18px;color:var(--ink);font-weight:400}
.terms section{display:flex;flex-direction:column;gap:4px}
.terms ul{margin:0;padding:0;list-style:none}
.terms li::before{content:"・"}
.terms li{padding-left:1em;text-indent:-1em}

/* ===== 作品 ===== */
.works{display:flex;flex-direction:column;gap:14px}
.work{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.embed{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed.sc{aspect-ratio:auto;height:300px;background:none}
.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:var(--btn);color:var(--ink);font-size:15px}
.xpost{max-width:550px;width:100%;margin:0 auto}
.xpost .twitter-tweet{margin:0 auto!important}
.cap{font-size:clamp(16px,4.4vw,19px)}

/* ===== 絵 ===== */
.gallery{columns:3 200px;column-gap:12px}
.gallery button{all:unset;cursor:zoom-in;display:block;margin:0 0 12px;break-inside:avoid}
.gallery button:focus-visible{outline:2px solid var(--teal)}
.gallery img{width:100%}
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.9);display:flex;align-items:center;justify-content:center;padding:24px}
.lb img{max-height:90vh;max-width:100%;width:auto}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  background:none;border:0;color:#fff;font-size:34px;cursor:pointer;line-height:1}

/* ===== 歌わせてみる ===== */
.sg-intro{display:flex;flex-direction:column;gap:4px}
.sg-status{font-size:14px;color:var(--ink);background:var(--white);padding:10px 14px;border-left:4px solid var(--title)}
.sg-status.err{border-color:var(--red)}
.sg-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sg-btn{border:0;background:var(--btn);color:var(--ink);font:inherit;font-weight:400;font-size:15px;min-height:42px;padding:6px 14px;cursor:pointer;letter-spacing:.04em}
.sg-btn:hover{background:var(--btn-hover)}
.sg-btn:disabled{opacity:.45;cursor:default}
.sg-btn.main{background:var(--title);color:var(--ink);font-weight:700;min-width:104px}
.sg-btn.main:hover{background:#e7a321}
.sg-seg{display:inline-flex}
.sg-seg .sg-btn{min-width:46px}
.sg-seg .sg-btn[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.sg-bar label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.sg-bar input[type=number],.sg-bar select,.sg-panel input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--white);border:1px solid var(--btn);min-height:42px;padding:4px 8px}
.sg-bar input[type=number]{width:72px}
.sg-prog{height:4px;background:var(--btn);overflow:hidden}
.sg-prog>i{display:block;height:100%;width:0;background:var(--title);transition:width .1s}

.roll{--rowH:22px;--keyW:46px;--rulerH:22px;position:relative;overflow:auto;height:min(62vh,560px);background:var(--white);border:1px solid var(--btn);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.roll-inner{position:relative}
.ruler{position:sticky;top:0;z-index:4;display:flex;height:var(--rulerH);background:var(--bg);border-bottom:1px solid var(--btn)}
.ruler .corner{position:sticky;left:0;z-index:5;flex:none;width:var(--keyW);background:var(--bg)}
.ruler .ticks{position:relative;flex:none}
.ruler .ticks span{position:absolute;top:2px;font-size:11px;color:var(--text);padding-left:4px;border-left:1px solid var(--rule);line-height:18px;font-variant-numeric:tabular-nums}
.roll-body{display:flex;position:relative}
.keys{position:sticky;left:0;z-index:3;flex:none;width:var(--keyW);background:var(--white);border-right:1px solid var(--btn)}
.keys div{height:var(--rowH);box-sizing:border-box;border-bottom:1px solid #ebe9ea;font-size:10px;line-height:var(--rowH);padding-left:4px;color:var(--text);cursor:pointer;user-select:none;-webkit-user-select:none}
.keys div.b{background:#3a3a3a;color:#bbb;margin-right:14px}
.keys div.c{color:var(--ink);font-weight:700}
.grid{position:relative;flex:none;touch-action:pan-x pan-y}
.note{position:absolute;box-sizing:border-box;height:calc(var(--rowH) - 2px);margin-top:1px;background:var(--band);border:1px solid #d7a12c;color:var(--ink);font-size:12px;line-height:calc(var(--rowH) - 4px);padding:0 10px 0 4px;overflow:hidden;white-space:nowrap;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.note::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.08);cursor:ew-resize}
.note.sel{background:var(--title);border:2px solid var(--ink);z-index:2}
.note.miss{background:repeating-linear-gradient(45deg,var(--band) 0 6px,#f1c2bc 6px 12px);border-color:var(--red)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2;pointer-events:none}

.sg-panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--white);padding:12px;min-height:66px}
.sg-panel .lbl{font-size:13px;color:var(--text)}
.sg-panel .val{min-width:3.2em;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.sg-panel input[type=text]{width:5.5em}
.sg-panel .grp{display:inline-flex;align-items:center;gap:4px}
.sg-panel .grp .sg-btn{min-width:42px;padding:6px 8px}
.sg-panel .empty{color:var(--text);font-size:14px}

.sg-more{background:var(--white);padding:12px 14px}
.sg-more summary{cursor:pointer;color:var(--ink);font-weight:400}
.sg-more .in{display:flex;flex-direction:column;gap:18px;padding-top:14px}
.sg-more textarea{font:inherit;font-size:16px;width:100%;min-height:88px;border:1px solid var(--btn);padding:8px;color:var(--ink);background:var(--white)}
.sg-sliders{display:grid;grid-template-columns:auto minmax(0,1fr) 3em;gap:8px 12px;align-items:center;font-size:14px;color:var(--ink)}
.sg-sliders output{font-variant-numeric:tabular-nums;text-align:right}
.sg-files{display:flex;flex-wrap:wrap;gap:10px}
.sg-files input[type=file]{display:none}
.sg-note{font-size:13px;line-height:1.7}

footer{background:var(--btn);color:var(--ink);text-align:center;font-size:13px;padding-block:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="logo" href="#home">砂上天獄</a>
    <button class="burger" id="burger" aria-label="メニューを開く" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav id="nav">
      <button class="close" id="close" aria-label="メニューを閉じる">×</button>
      <ul class="menu">
        <li><a href="#home">ホーム</a></li>
        <li><a href="#utau">UTAU</a>
          <ul class="sub">
            <li><a href="#terms">利用規約</a></li>
            <li><a href="#tototo">注寝ととと</a></li>
            <li><a href="#ust">UST</a></li>
            <li><a href="#sing">歌わせてみる</a></li>
          </ul>
        </li>
        <li><a href="#mycoe">MYCOE</a>
          <ul class="sub"><li><a href="#toto">注与とと</a></li></ul>
        </li>
        <li><a href="#works">作品</a></li>
        <li><a href="#gallery">絵</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main"></main>

<footer><div class="wrap">© 砂上電力</div></footer>

<div class="lb" id="lb" hidden><button id="lbClose" aria-label="閉じる">×</button><img id="lbImg" alt=""></div>

<script>
const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
/* ======================================================
   データ（ここを書き換えればページが更新される）
   ====================================================== */

// 画像：src（リポジトリ内）を先に読み、無ければ fb（Wix）を表示する
// → img/ に同じ名前でアップロードすればコードを触らずに切り替わる
const W = id => `https://static.wixstatic.com/media/87b28a_${id}`;
const IMG = {
  tototo:     {src:'img/tototo.png',      fb:W('aed14a8bbfa34bf49c4f880f2f25e836~mv2.png')},
  tototoIcon: {src:'img/tototo_icon.png', fb:W('a80b512c13f242d6826fdee97af0a04d~mv2.png/v1/crop/x_776,y_50,w_1025,h_1025/fill/w_640,h_752,al_c,q_90/i.png')},
  toto:       {src:'img/toto.png',        fb:W('b6fc053afc934557b59df26a6b2fa83b~mv2.png')},
  totoIcon:   {src:'img/toto_icon.png',   fb:W('72c7fcff13bf4a6c8e2e188ca1d6ca0d~mv2.png/v1/crop/x_622,y_55,w_1108,h_1108/fill/w_640,h_752,al_c,q_90/i.png')},
};
const pic = o => `src="${o.src}" data-fb="${o.fb}"`;

// 試聴音声：audio/ に置いたファイル（無ければ「試聴音声は準備中です」と出る）
const AUDIO = {
  tototo_v111:'audio/tototo_v111.mp3',
  tototo_v110:'audio/tototo_v110.mp3',
  tototo_v100:'audio/tototo_v100.mp3',
  toto_1:'audio/toto_1.mp3',
  toto_2:'audio/toto_2.mp3',
  toto_3:'audio/toto_3.mp3',
};

// 更新履歴：新しいものを上に追加
const HISTORY = [
  ['26/7/15','サイトの更新　絵を追加しました'],
  ['24/4/11','注寝とととver1.11を公開しました。原音設定が少し改善されています（たぶん）'],
  ['22/11/09','注与ととver1.10を公開しました。'],
  ['22/11/08','注寝とととver1.00を公開しました。'],
  ['22/10/31','音源をとりなおしたのでちかいうちに最新版を出します。'],
  ['21/03/21','注寝ととと配布開始'],
  ['21/03/19','サイト開設'],
  ['21/03/10','ととと誕生'],
];

// 作品：上から古い順（元サイトどおり「下に行くほど新しい」）。新しいものは末尾に追加
// url に YouTube / X / SoundCloud のURLを入れると自動で埋め込みになる。空なら仮枠
const WORKS = [
  {title:'【UTAUカバー】夜に駆ける', url:'', cap:'歌うかどうかテストしたときの動画'},
  {title:'君の席/注寝ととと-UTAU',  url:'', cap:'音源公開動画'},
  {title:'big brother/注寝ととと',  url:'', cap:'耳コピがんばりました　カバーです。'},
  {title:'きゅうくらりん（X）',      url:'', cap:'きゅうくらりんを歌わせました'},
  {title:'【UTAU Cover】Daisy Bell', url:'', cap:'とととは英語を歌える'},
  {title:'Still Alive(Portal)（X）', url:'', cap:'まだ生きている'},
  {title:'【UTAU Cover】イガク',     url:'', cap:'イガク　カバーです。　ユ！'},
  {title:'【UTAU Cover】±0',         url:'', cap:'動画がかわいいです'},
  {title:'Lab=01 //utau cover（SoundCloud）', url:'', cap:''},
];
// 作っていただいたカバー：{title, url}
const FAN_COVERS = [];

// 絵：新しく追加した絵は配列の先頭に入れる（上に表示される）
// 新しい絵は 'img/gallery/ファイル名' をそのまま先頭に書けばOK
// 既存分は img/gallery/g01.png〜g21.png（下の並び順）として置けば自動で切り替わる
const GALLERY = [

function embed(w){
  const u = w.url || '';
  let m;
  if ((m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/)))
    return `<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="${w.title}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  if (/^https:\/\/(twitter|x)\.com\//.test(u))
    return `<div class="xpost"><blockquote class="twitter-tweet" data-media-max-width="560"><a href="${u.replace('x.com','twitter.com')}">${w.title}</a></blockquote></div>`;
  if (/soundcloud\.com\//.test(u))
    return `<div class="embed sc"><iframe src="https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}&color=%23ff5500&visual=false" title="${w.title}" loading="lazy" allow="autoplay"></iframe></div>`;
  return `<div class="embed placeholder">${w.title}<br>（URL未設定）</div>`;
}

/* ======================================================
   歌わせてみる（@onjmin/koe + worldline）
   ====================================================== */
const SING = (() => {
  // ---- 設定 ----
  const KOE_BASE = 'https://cdn.jsdelivr.net/npm/@onjmin/koe@1.0.11/dist/';
  const VOICE_URL = 'voice/tototo.koe';
  const STORE_KEY = 'sazyouutau-sing-v2';
  const TPQ = 480;                 // 4分音符あたりのtick（UST準拠）
  const FS = 48000;
  const TOP = 84, BOTTOM = 48;     // C6〜C3
  const ROWS = TOP - BOTTOM + 1;
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BLACK = new Set([1,3,6,8,10]);
  const midiName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

  // ---- かな ----
  const SMALL = 'ぁぃぅぇぉゃゅょゎ';
  const VOWEL = {};
  for (const [v, cs] of Object.entries({
    a: 'あぁかがさざただなはばぱまやゃらわ', i: 'いぃきぎしじちぢにひびぴみり', u: 'うぅくぐすずつづぬふぶぷむゆゅるゔ',
    e: 'えぇけげせぜてでねへべぺめれ', o: 'おぉこごそぞとどのほぼぽもよょろを', n: 'ん' })) for (const c of cs) VOWEL[c] = v;
  const VOWEL_KANA = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お', n: 'ん' };
  const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const vowelOf = ly => { for (let i = ly.length - 1; i >= 0; i--) if (VOWEL[ly[i]]) return VOWEL[ly[i]]; return '-'; };
  function splitMora(text) {
    const out = [];
    for (const ch of toHira(text)) {
      if (/[\sぁ-んー]/.test(ch) === false) continue;
      if (/\s/.test(ch)) continue;
      if (SMALL.includes(ch) && out.length) { out[out.length - 1] += ch; continue; }
      if (ch === 'ー') { out.push(VOWEL_KANA[vowelOf(out[out.length - 1] || 'あ')] || 'あ'); continue; }
      out.push(ch);
    }
    return out;
  }
  // USTの歌詞（"a か" や "- か" 形式も）から仮名部分だけを取り出す
  const lyricFromUst = s => { s = s.trim(); const sp = s.lastIndexOf(' '); return toHira(sp >= 0 ? s.slice(sp + 1) : s); };

  // ---- サンプル曲：「君の席」（作者本人の曲） ----
  // 「歌詞,長さ(tick),音程」を ; でつないだもの。「R,長さ」は休符。テンポは下の tempo
  const KIMI = 'つ,480,59;め,240,59;た,480,59;い,240,59;こ,480,61;こ,480,61;ろ,240,62;に,240,64;わ,1440,57;R,1440;あ,240,59;R,240;た,240,59;か,480,59;い,240,59;ちゃ,720,61;お,240,61;い,240,59;れ,240,61;よ,1440,62;R,1440;ゆ,480,59;が,240,66;む,720,64;み,480,59;な,240,66;も,480,64;に,240,57;わ,1200,57;R,240;あ,1200,62;あ,240,62;ぐ,480,59;にゃ,240,66;り,720,64;へ,480,59;ん,240,66;な,480,64;か,240,69;お,1200,64;R,1440;R,240;な,480,59;き,240,59;た,480,59;い,240,59;こ,480,61;こ,480,61;ろ,240,62;な,240,64;ら,1440,57;R,1440;や,480,59;さ,240,59;し,720,59;さ,480,61;で,480,61;つ,240,59;つ,240,61;も,1440,62;R,1440;お,480,59;か,240,66;し,480,64;も,240,59;ふ,480,59;う,240,66;せ,480,64;ん,240,57;も,1200,57;R,240;あ,1200,62;あ,240,62;ぜ,480,59;ん,240,66;ぶ,720,64;き,480,59;み,240,66;の,480,64;も,240,69;の,1200,64;R,1680;ほ,960,64;じ,480,66;ちゃ,1440,62;りょ,960,61;く,480,61;ちゃ,480,62;R,960;と,1440,64;と,1440,62;と,1440,69;と,1200,64;R,240;あ,960,64;あ,480,66;る,1440,62;ぐ,960,61;れ,480,61;い,960,62;と,480,66;と,1200,59;R,4560;さ,240,59;い,240,59;しょ,240,66;の,480,64;R,240;て,120,59;い,360,59;しゃ,240,66;え,480,64;き,240,57;わ,1440,59;R,1440;お,480,59;な,240,66;じ,720,64;ふ,240,59;た,240,59;り,240,69;お,240,66;の,240,64;せ,240,64;て,480,66;R,2400;か,480,59;ら,240,66;の,480,64;R,240;わ,480,59;た,240,66;し,480,64;に,240,57;わ,1440,59;R,1440;や,480,59;さ,240,66;し,720,64;こ,240,59;こ,240,59;ろ,240,69;お,240,66;く,240,64;れ,240,64;る,1440,64;う,720,66;R,720;さ,240,59;い,240,59;ご,240,66;の,480,64;R,240;れ,120,59;R,240;しゃ,360,66;に,480,64;い,240,57;わ,1440,59;R,1440;か,480,59;な,240,66;し,720,64;ぼ,240,59;く,240,59;だ,240,69;け,240,66;の,240,64;せ,240,64;て,480,66;R,2400;か,480,59;ら,240,66;の,480,64;R,240;ぼ,240,59;く,240,59;の,240,66;せ,480,64;き,240,57;わ,1440,59;R,1440;ぼ,240,59;く,240,59;じゃ,240,66;な,480,64;い,240,64;き,240,59;み,240,59;に,240,69;あ,240,66;げ,240,64;る,240,64;う,480,66';
  const ustSong = (tempo, str) => {
    const notes = []; let t = 0;
    for (const tok of str.split(';')) { const [ly, len, midi] = tok.split(','); const n = +len; if (ly !== 'R') notes.push({ t, len: n, midi: +midi, ly }); t += n; }
    return { tempo, notes, gender: 0.5, tension: 0.5, breath: 0.5 };
  };
  const SAMPLES = {
    kimi: { title: '君の席（砂上電力）', ...ustSong(170, KIMI) },
  };
  const DEFAULT_SAMPLE = 'kimi';
  const sampleState = k => { const { title, ...rest } = SAMPLES[k]; return structuredClone(rest); };

  // ---- 状態 ----
  let st = load();
  let sel = -1, mode = 'write', snap = 240, ppt = 0.15;
  let koe = null, bank = null, wl = null, voiceErr = '', loading = null;
  const pcmCache = new Map(), noteCache = new Map();
  let ctx = null, src = null, playStart = 0, raf = 0, lastMix = null, busy = false, abort = false;
  let el = {};

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && Array.isArray(s.notes)) {
        // 前のサンプル曲（さくらさくら・きらきら星）が、手を加えずにそのまま保存されているだけなら、新しいサンプルに置き換える
        const n0 = s.notes[0] || {};
        if ((s.tempo === 72 && s.notes.length === 50 && n0.ly === 'さ') || (s.tempo === 104 && s.notes.length === 42 && n0.ly === 'お')) return sampleState(DEFAULT_SAMPLE);
        return { ...sampleState(DEFAULT_SAMPLE), ...s };
      }
    } catch {}
    return sampleState(DEFAULT_SAMPLE);
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch {} }
  const sorted = () => st.notes.map((n, i) => ({ ...n, i })).sort((a, b) => a.t - b.t || b.midi - a.midi);

  // ---- 読み込み ----
  function ensureVoice() {
    if (loading) return loading;
    loading = (async () => {
      setStatus('声を読み込み中…');
      try { koe = await import(KOE_BASE + 'index.js'); }
      catch (e) { voiceErr = '歌声エンジンを読み込めませんでした。通信状況を確認して、ページを開き直してください。'; throw e; }
      const url = new URL(VOICE_URL, location.href).href;
      try { bank = await koe.VoiceBank.load(url); }
      catch (e) {
        // 部分読み込み（Range）に応じないサーバーでは、ファイル全体を読み込んでから使う
        console.warn('Range読み込みに失敗、全体を読み込みます:', e);
        try { bank = await koe.VoiceBank.load(await fetchWhole(url)); }
        catch (e2) { voiceErr = `注寝とととの声のデータ（voice/tototo.koe）を読み込めませんでした（${e2.message || e2}）。音符の編集はできます。`; throw e2; }
      }
      try { wl = await koe.Worldline.load({ scriptUrl: KOE_BASE + 'world/worldline.js' }); }
      catch (e) { voiceErr = '合成エンジン（worldline）を読み込めませんでした。'; throw e; }
      setStatus(`準備できました（${Object.keys(bank.manifest.phonemes).length}音素）。▶ 歌う を押してください。`);
      paint();
    })().catch(e => { console.error(e); setStatus(voiceErr || String(e), true); refreshButtons(); });
    return loading;
  }

  async function fetchWhole(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const total = +res.headers.get('Content-Length') || 0;
    if (!res.body || !total) return await res.blob();
    const reader = res.body.getReader(), chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      chunks.push(value); got += value.length;
      setStatus(`声のデータを読み込み中… ${Math.round(got / total * 100)}%（初回のみ・約${Math.round(total / 1e6)}MB）`);
      if (el.prog) el.prog.style.width = (got / total * 100).toFixed(1) + '%';
    }
    if (el.prog) el.prog.style.width = '0';
    return new Blob(chunks);
  }

  // 歌詞＋直前の母音＋音程 → 音源のエイリアス
  const nextPv = (ly, p) => ly === 'ー' ? (p === '-' ? 'a' : p) : vowelOf(ly);
  function resolve(ly, pv, midi) {
    if (!bank) return null;
    if (ly === 'ー') ly = VOWEL_KANA[pv] || 'あ';
    const names = bank.manifest.phonemes;
    const has = a => Object.hasOwn(names, a);
    if (has(ly)) return ly;
    const tries = [ly]; if (ly === 'を') tries.push('お'); if (ly === 'ゔ') tries.push('ぶ');
    const suffixes = pitchSuffixes(midi);
    for (const k of tries) for (const b of [`${pv} ${k}`, `- ${k}`, k, `* ${k}`]) {
      for (const s of suffixes) if (has(b + s)) return b + s;
    }
    return null;
  }
  let suffixList = null;
  function pitchSuffixes(midi) {
    if (!suffixList) {
      const set = new Set();
      for (const n of Object.keys(bank.manifest.phonemes)) { const m = /_([A-G][#b]?-?\d)$/.exec(n); if (m) set.add(m[1]); }
      suffixList = [...set].map(t => { const m = /^([A-G])([#b]?)(-?\d)$/.exec(t); let s = NAMES.indexOf(m[1]); if (m[2] === '#') s++; else if (m[2] === 'b') s--; return { t, midi: (+m[3] + 1) * 12 + s }; });
    }
    return [...suffixList.slice().sort((a, b) => Math.abs(a.midi - midi) - Math.abs(b.midi - midi)).map(x => '_' + x.t), ''];
  }

  async function getPcm(alias) {
    if (!pcmCache.has(alias)) pcmCache.set(alias, bank.getPcm(alias));
    return pcmCache.get(alias);
  }

  // ---- 合成：音符列 → フレーズごとの波形 ----
  // 連続音は先行発声が長いので、2音目以降は手前90msだけ残して前の音と35msクロスフェードする（koeのデモと同じ考え方）
  // 休符で区切られたフレーズができるたびに onPhrase(波形, 開始サンプル) を呼ぶ → できたところから鳴らせる
  const LEAD0 = 0.4;
  async function renderMix(notes, onProgress, onPhrase) {
    const LEADCAP = 90, XF = 35, MINXF = 5, TAIL = 10;
    const msPerTick = 60000 / st.tempo / TPQ;
    // 単音化：重なりは後ろの音符の頭で切る
    const ns = notes.map(n => ({ ...n }));
    for (let k = 0; k < ns.length - 1; k++) if (ns[k].t + ns[k].len > ns[k + 1].t) ns[k].len = Math.max(30, ns[k + 1].t - ns[k].t);

    // 先にエイリアスを決めて、必要な音素をまとめて取得
    let pv = '-', prevEnd = -1, prevMidi = null;
    for (const n of ns) {
      const chained = n.t === prevEnd && pv !== '-';
      n.alias = resolve(n.ly, chained ? pv : '-', n.midi);
      n.chained = chained; n.prevMidi = chained ? prevMidi : null; prevMidi = n.alias ? n.midi : null;
      pv = n.alias ? nextPv(n.ly, chained ? pv : '-') : '-';
      prevEnd = n.t + n.len;
    }
    const uniq = [...new Set(ns.map(n => n.alias).filter(Boolean))];
    let got = 0;
    const queue = uniq.slice();
    await Promise.all(Array.from({ length: 6 }, async () => { while (queue.length) { await getPcm(queue.shift()); onProgress?.(++got / uniq.length * 0.15); } }));

    const parts = []; let phrase = [], prev = null, done = 0;
    const ms = v => Math.max(1, Math.round(v / 1000 * FS));
    const tail = sg => { if (sg) { sg.outLen = TAIL; sg.outAt = sg.end - ms(TAIL); } };
    const flush = () => {
      if (!phrase.length) return;
      const s0 = Math.min(...phrase.map(x => x.start));
      const e0 = Math.max(...phrase.map(x => Math.min(x.end, x.outAt + ms(x.outLen))));
      const buf = new Float32Array(Math.max(1, e0 - s0));
      for (const x of phrase) {
        const inN = ms(x.inLen), outN = ms(x.outLen), stopAt = Math.min(x.end, x.outAt + outN);
        for (let p = x.start; p < stopAt; p++) {
          const k = p - x.start; let g = 1;
          if (k < inN) g *= Math.sin(Math.PI / 2 * k / inN);
          if (p >= x.outAt) g *= Math.cos(Math.PI / 2 * Math.min(1, (p - x.outAt) / outN));
          buf[p - s0] += x.data[k] * g;
        }
      }
      for (let i = 0; i < buf.length; i++) { const v = buf[i]; if (v > 0.9) buf[i] = 0.9 + Math.tanh((v - 0.9) * 10) / 10; else if (v < -0.9) buf[i] = -0.9 - Math.tanh((-v - 0.9) * 10) / 10; }
      parts.push([buf, s0]); onPhrase?.(buf, s0); phrase = [];
    };
    for (const n of ns) {
      if (abort) return null;
      const durMs = n.len * msPerTick;
      if (!n.alias) { tail(prev); prev = null; flush(); continue; }
      const entry = bank.manifest.phonemes[n.alias];
      const key = [n.alias, n.midi, n.prevMidi, Math.round(durMs), st.tempo, st.gender, st.tension, st.breath].join('|');
      let audio = noteCache.get(key);
      if (!audio) {
        const pcm = await getPcm(n.alias);
        audio = pcm ? wl.renderNote({ pcm, pitch: pitchCurve(n.prevMidi, n.midi, (entry.pre || 0) / FS * 1000), durationMs: durMs, tempo: st.tempo,
          gender: st.gender, tension: st.tension, breathiness: st.breath, ...koe.leadInFromEntry(entry) }) : null;
        if (audio) noteCache.set(key, audio);
      }
      onProgress?.(0.15 + ++done / ns.length * 0.85);
      await new Promise(r => setTimeout(r, 0));
      if (abort) return null;
      if (!audio || !audio.length) { tail(prev); prev = null; flush(); continue; }
      const preMs = (entry.pre || 0) / FS * 1000;
      const head = !(n.chained && prev);
      const effPre = head ? preMs : Math.min(preMs, LEADCAP, prev.durMs);
      const skip = Math.max(0, Math.round((preMs - effPre) / 1000 * FS));
      const beat = Math.round((LEAD0 + n.t * msPerTick / 1000) * FS);
      const start = Math.max(0, beat - Math.round(effPre / 1000 * FS));
      const data = audio.subarray(Math.min(skip, audio.length));
      const xf = head ? TAIL : Math.max(MINXF, Math.min(effPre, XF));
      const seg = { data, start, end: start + data.length, inLen: xf, outAt: start + data.length, outLen: TAIL, durMs };
      if (head) { tail(prev); flush(); } else { prev.outAt = start; prev.outLen = xf; }
      phrase.push(seg); prev = seg;
    }
    tail(prev); flush();
    const total = parts.length ? Math.max(...parts.map(([b, s0]) => s0 + b.length)) + FS / 4 : FS;
    const mix = new Float32Array(total);
    for (const [b, s0] of parts) for (let i = 0; i < b.length; i++) mix[s0 + i] += b[i];
    return mix;
  }

  // 音程カーブ：拍（= 先行発声の位置）の 45ms 前から 35ms 後にかけて前の音から今の音へ移る。それより前は前の音の高さのまま
  function pitchCurve(prevMidi, midi, beatMs) {
    if (prevMidi == null || prevMidi === midi) return midiHz(midi);
    const a = beatMs - 45, b = beatMs + 35;
    return t => {
      const u = t <= a ? 0 : t >= b ? 1 : (1 - Math.cos(Math.PI * (t - a) / (b - a))) / 2;
      return midiHz(prevMidi + (midi - prevMidi) * u);
    };
  }

  // ---- 再生 ----
  let srcs = [];
  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      try { ctx = new AC({ sampleRate: FS }); } catch { ctx = new AC(); }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function stop() {
    abort = true;
    for (const x of srcs) { try { x.stop(); } catch {} }
    srcs = []; src = null;
    cancelAnimationFrame(raf); if (el.head) el.head.hidden = true;
    refreshButtons();
  }
  function follow(x) {
    const r = el.roll, keyW = 46, vis = r.clientWidth - keyW;
    if (x < r.scrollLeft || x > r.scrollLeft + vis * 0.8) r.scrollLeft = Math.max(0, x - vis * 0.2);
  }
  async function sing(notes, fromTick = 0, label = '合成中') {
    const c = getCtx();             // iPhoneはタップ中にAudioContextを起こす必要がある
    stop(); abort = false;
    await ensureVoice(); if (!bank || !wl) return;
    busy = true; refreshButtons();
    const msPerTick = 60000 / st.tempo / TPQ;
    let T0 = null, lastEnd = 0, endTimer = 0;
    const startHead = () => {
      playStart = T0 + LEAD0 - fromTick * msPerTick / 1000;
      const tick = () => {
        const tk = (c.currentTime - playStart) * 1000 / msPerTick + fromTick;
        if (tk >= fromTick) { el.head.hidden = false; el.head.style.left = (tk * ppt) + 'px'; follow(tk * ppt); }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    };
    const onPhrase = (buf, s0) => {
      if (abort) return;
      if (T0 === null) { T0 = c.currentTime + 0.12 - s0 / FS; startHead(); src = true; }
      const when = T0 + s0 / FS, now = c.currentTime + 0.02;
      const off = Math.max(0, now - when);           // 合成が追いつかなかった分は頭を飛ばす
      if (off * FS >= buf.length) return;
      const b = c.createBuffer(1, buf.length, FS); b.copyToChannel(buf, 0);
      const x = c.createBufferSource(); x.buffer = b; x.connect(c.destination);
      x.start(Math.max(when, now), off); srcs.push(x);
      lastEnd = Math.max(lastEnd, when + buf.length / FS);
      refreshButtons();
    };
    try {
      const mix = await renderMix(notes, p => { el.prog.style.width = (p * 100).toFixed(1) + '%'; if (T0 === null) setStatus(`${label}… ${Math.round(p * 100)}%`); }, onPhrase);
      if (!mix || abort) return;
      lastMix = mix;
      const miss = notes.filter(n => !resolve(n.ly, '-', n.midi) && !resolve(n.ly, 'a', n.midi)).length;
      setStatus(miss ? `再生中（歌えない歌詞が ${miss} 個あります。赤い縞の音符を確認してください）` : '再生中', !!miss);
      if (T0 !== null) {
        const myRun = srcs;
        clearTimeout(endTimer);
        endTimer = setTimeout(() => { if (srcs === myRun) { srcs = []; src = null; cancelAnimationFrame(raf); el.head.hidden = true; setStatus('歌い終わりました'); refreshButtons(); } }, Math.max(0, (lastEnd - c.currentTime) * 1000 + 100));
      }
    } catch (e) { console.error(e); setStatus('合成に失敗しました：' + e.message, true); }
    finally { busy = false; el.prog.style.width = '0'; refreshButtons(); paint(); }
  }

  // ---- 描画 ----
  function totalTicks() { const end = st.notes.reduce((m, n) => Math.max(m, n.t + n.len), 0); return Math.max(16 * 1920, Math.ceil(end / 1920 + 4) * 1920); }
  function layout() {
    const W = totalTicks() * ppt;
    el.grid.style.width = W + 'px'; el.grid.style.height = (ROWS * 22) + 'px';
    el.ticks.style.width = W + 'px';
    const beat = TPQ * ppt, bar = beat * 4;
    el.grid.style.background = `repeating-linear-gradient(to right, #a9a7a8 0 1px, transparent 1px ${bar}px),
      repeating-linear-gradient(to right, #d6d4d5 0 1px, transparent 1px ${beat}px),
      repeating-linear-gradient(to bottom, ${rowStops()})`;
    let h = ''; for (let m = 0; m * 1920 < totalTicks(); m++) h += `<span style="left:${m * 1920 * ppt}px">${m + 1}</span>`;
    el.ticks.innerHTML = h;
  }
  function rowStops() {
    const out = []; for (let r = 0; r < 12; r++) { const m = TOP - r; const c = BLACK.has(m % 12) ? '#ecebec' : '#fbfbfb'; out.push(`${c} ${r * 22}px ${(r + 1) * 22 - 1}px, #e3e1e2 ${(r + 1) * 22 - 1}px ${(r + 1) * 22}px`); }
    return out.join(',');
  }
  // 各音符の連続音エイリアス（「- さ」「a く」…）。前の音符と隙間なくつながっていれば前の母音、休符のあとは「-」
  function vcv() {
    const ord = sorted(), label = new Map(), miss = new Set(); let pv = '-', prevEnd = -1;
    for (const n of ord) {
      const p = n.t === prevEnd ? pv : '-';
      const kana = n.ly === 'ー' ? (VOWEL_KANA[p] || 'あ') : n.ly;
      const a = bank ? resolve(n.ly, p, n.midi) : null;
      if (bank && !a) miss.add(n.i);
      label.set(n.i, a || `${p} ${kana}`);
      pv = (!bank || a) ? nextPv(n.ly, p) : '-';
      prevEnd = n.t + n.len;
    }
    return { label, miss };
  }
  function paint() {
    const { label, miss } = vcv();
    el.grid.querySelectorAll('.note').forEach(x => x.remove());
    const frag = document.createDocumentFragment();
    st.notes.forEach((n, i) => {
      const d = document.createElement('div');
      d.className = 'note' + (i === sel ? ' sel' : '') + (miss.has(i) ? ' miss' : '');
      d.dataset.i = i; d.textContent = label.get(i);
      d.style.left = n.t * ppt + 'px'; d.style.top = (TOP - n.midi) * 22 + 'px'; d.style.width = Math.max(10, n.len * ppt) + 'px';
      frag.appendChild(d);
    });
    el.grid.appendChild(frag);
    panel();
  }
  function panel() {
    const n = st.notes[sel];
    if (!n) { el.panel.innerHTML = `<span class="empty">音符をタップすると、ここで歌詞・音程・長さを変えられます。</span>`; return; }
    el.panel.innerHTML = `
      <label class="grp"><span class="lbl">歌詞</span><input type="text" id="sgLyric" value="${esc(n.ly)}" maxlength="8" enterkeyhint="next" autocomplete="off"></label>
      <span class="grp"><span class="lbl">連続音</span><span class="val" id="sgAlias" style="min-width:4.5em">${esc(vcv().label.get(sel))}</span></span>
      <span class="grp"><span class="lbl">音程</span><button class="sg-btn" data-act="down" aria-label="半音下げる">▼</button><span class="val">${midiName(n.midi)}</span><button class="sg-btn" data-act="up" aria-label="半音上げる">▲</button></span>
      <span class="grp"><span class="lbl">長さ</span><button class="sg-btn" data-act="shorter" aria-label="短くする">−</button><span class="val">${lenName(n.len)}</span><button class="sg-btn" data-act="longer" aria-label="長くする">＋</button></span>
      <span class="grp"><span class="lbl">位置</span><button class="sg-btn" data-act="left" aria-label="前へ">◀</button><button class="sg-btn" data-act="right" aria-label="後ろへ">▶</button></span>
      <span class="grp"><button class="sg-btn" data-act="hear">♪ この音</button><button class="sg-btn" data-act="from">ここから歌う</button><button class="sg-btn" data-act="del">消す</button></span>`;

    <button class="sg-btn main" id="sgPlay">▶ 歌う</button>
    <button class="sg-btn" id="sgStop">■ 止める</button>
    <label>テンポ <input type="number" id="sgTempo" min="40" max="300" step="1" inputmode="numeric"></label>
    <span class="sg-seg" role="group" aria-label="モード"><button class="sg-btn" data-mode="write">書く</button><button class="sg-btn" data-mode="select">選ぶ</button><button class="sg-btn" data-mode="erase">消す</button></span>
    <label>長さ <select id="sgSnap">${lens.map(([v, t]) => `<option value="${v}"${v === snap ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    <span class="sg-seg" role="group" aria-label="拡大縮小"><button class="sg-btn" id="sgZoomOut" aria-label="縮小">−</button><button class="sg-btn" id="sgZoomIn" aria-label="拡大">＋</button></span>
  </div>
  <div class="roll" id="sgRoll">
    <div class="roll-inner">
      <div class="ruler"><div class="corner"></div><div class="ticks" id="sgTicks"></div></div>
      <div class="roll-body">
        <div class="keys" id="sgKeys">${keys}</div>
        <div class="grid" id="sgGrid"><div class="playhead" id="sgHead" hidden></div></div>
      </div>
    </div>
  </div>
  <div class="sg-panel" id="sgPanel"></div>
  <details class="sg-more">
    <summary>歌詞の流し込み・声の調整・ファイル</summary>
    <div class="in">
      <div class="stack">
        <label for="sgBulk" class="sg-note">ひらがなで歌詞を書いて「流し込む」を押すと、選んでいる音符（なければ最初の音符）から順に1文字ずつ入ります。「きゃ」などの小さい字はまとめて1音になります。</label>
        <textarea id="sgBulk" placeholder="さくら さくら やよいのそらは"></textarea>
        <div class="sg-files"><button class="sg-btn" id="sgPour">流し込む</button></div>
      </div>
      <div class="sg-sliders">
        <label for="sgGender">声の太さ</label><input type="range" id="sgGender" min="0" max="1" step="0.05"><output id="sgGenderV"></output>
        <label for="sgTension">力み</label><input type="range" id="sgTension" min="0" max="1" step="0.05"><output id="sgTensionV"></output>
        <label for="sgBreath">息っぽさ</label><input type="range" id="sgBreath" min="0" max="1" step="0.05"><output id="sgBreathV"></output>
      </div>
      <div class="sg-files">
        <label class="sg-btn" for="sgUst" style="display:inline-flex;align-items:center">読み込む（UST・USTX・MIDI）</label><input type="file" id="sgUst" accept=".ust,.ustx,.mid,.midi">
        <button class="sg-btn" id="sgUstSave">USTで保存</button>
        <button class="sg-btn" id="sgUstxSave">USTXで保存</button>
        <button class="sg-btn" id="sgMidiSave">MIDIで保存</button>
        <button class="sg-btn" id="sgWav" disabled>WAVで保存</button>
        <span class="sg-files"><select id="sgSample" aria-label="サンプル曲" style="font:inherit;font-size:16px;min-height:42px;border:1px solid var(--btn);background:var(--white);color:var(--ink)">${Object.entries(SAMPLES).map(([k, v]) => `<option value="${k}">${v.title}</option>`).join('')}</select><button class="sg-btn" id="sgReset">サンプル曲を読み込む</button></span>
        <button class="sg-btn" id="sgClear">全部消す</button>
      </div>
      <p class="sg-note">合成には <a class="u" href="https://github.com/onjmin/koe" target="_blank" rel="noopener">koe</a>（WORLDボコーダ / OpenUtau worldline）を使っています。作った曲はこのブラウザに自動で保存されます。歌わせたものを公開する場合は<a class="u" href="#terms">利用規約</a>に沿ってください。</p>
    </div>
  </details>
  ${back('tototo')}`;
  }

  function mount() {
    const $ = id => document.getElementById(id);
    el = { status: $('sgStatus'), prog: $('sgProg'), play: $('sgPlay'), stop: $('sgStop'), tempo: $('sgTempo'), roll: $('sgRoll'), grid: $('sgGrid'),
      ticks: $('sgTicks'), keys: $('sgKeys'), head: $('sgHead'), panel: $('sgPanel'), bulk: $('sgBulk'), wav: $('sgWav'), modes: [...document.querySelectorAll('[data-mode]')] };
    el.tempo.value = st.tempo;
    lastTotal = 0; layoutIfGrown(); paint(); refreshButtons();
    // 最初の音符が見える位置へ
    const first = sorted()[0]; el.roll.scrollTop = first ? Math.max(0, (TOP - first.midi) * 22 - el.roll.clientHeight / 2) : (TOP - 67) * 22;

    el.play.addEventListener('click', () => sing(sorted(), 0));
    el.stop.addEventListener('click', () => { stop(); setStatus('止めました'); });
    el.tempo.addEventListener('change', () => { const v = Math.max(40, Math.min(300, +el.tempo.value || 120)); st.tempo = v; el.tempo.value = v; save(); });
    el.modes.forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; refreshButtons(); }));
    $('sgSnap').addEventListener('change', e => { snap = +e.target.value; });
    $('sgZoomIn').addEventListener('click', () => zoom(1.4));
    $('sgZoomOut').addEventListener('click', () => zoom(1 / 1.4));
    el.panel.addEventListener('click', onPanel);
    el.keys.addEventListener('click', e => { const k = e.target.closest('[data-midi]'); if (k && bank) previewQuiet({ ly: 'あ', midi: +k.dataset.midi }); });
    $('sgPour').addEventListener('click', pourLyrics);
    for (const [id, key] of [['sgGender', 'gender'], ['sgTension', 'tension'], ['sgBreath', 'breath']]) {
      const r = $(id), o = $(id + 'V'); r.value = st[key]; o.textContent = (+st[key]).toFixed(2);
      r.addEventListener('input', () => { st[key] = +r.value; o.textContent = (+r.value).toFixed(2); save(); });
    }
    $('sgUst').addEventListener('change', e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; });
    $('sgUstSave').addEventListener('click', writeUst);
    $('sgUstxSave').addEventListener('click', writeUstx);
    $('sgMidiSave').addEventListener('click', writeMidi);
    el.wav.addEventListener('click', writeWav);
    $('sgReset').addEventListener('click', () => {
      const k = $('sgSample').value;
      if (!confirm(`「${SAMPLES[k].title}」を読み込みますか？（今の曲は消えます）`)) return;
      stop(); st = sampleState(k); sel = -1; save(); el.tempo.value = st.tempo;
      for (const [id, key] of [['sgGender', 'gender'], ['sgTension', 'tension'], ['sgBreath', 'breath']]) { $(id).value = st[key]; $(id + 'V').textContent = (+st[key]).toFixed(2); }
      lastTotal = 0; layoutIfGrown(); paint(); el.roll.scrollLeft = 0; scrollToNote(sorted()[0]); setStatus(`「${SAMPLES[k].title}」を読み込みました`);
    });
    $('sgClear').addEventListener('click', () => { if (!confirm('音符を全部消しますか？')) return; stop(); st.notes = []; sel = -1; save(); paint(); });
    bindGrid();
    document.addEventListener('keydown', onKey);
    if (voiceErr) setStatus(voiceErr, true); else if (bank) setStatus('準備できました。▶ 歌う を押してください。'); else ensureVoice();
  }
  function zoom(f) {
    const r = el.roll, cx = (r.scrollLeft + r.clientWidth / 2) / ppt;
    ppt = Math.max(0.04, Math.min(0.6, ppt * f)); lastTotal = 0; layoutIfGrown(); paint();
    r.scrollLeft = cx * ppt - r.clientWidth / 2;
  }
  function onKey(e) {
    if (!el.grid?.isConnected) return;
    if (e.target.closest('input,textarea,select')) return;
    if (e.key === ' ') { e.preventDefault(); src || busy ? stop() : sing(sorted(), 0); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0) { st.notes.splice(sel, 1); sel = -1; save(); paint(); }
    else if (e.key === 'ArrowRight' && sel >= 0) { e.preventDefault(); selectNext(1); }
    else if (e.key === 'ArrowLeft' && sel >= 0) { e.preventDefault(); selectNext(-1); }
  }
  function unmount() { stop(); document.removeEventListener('keydown', onKey); }

  return { html, mount, unmount };
})();

/* ======================================================
   ルーター・UI
   ====================================================== */
const main = document.getElementById('main');
const nav = document.getElementById('nav'), burger = document.getElementById('burger');
function openNav(){nav.classList.add('open');burger.setAttribute('aria-expanded','true');document.body.style.overflow='hidden'}
function closeNav(){nav.classList.remove('open');burger.setAttribute('aria-expanded','false');document.body.style.overflow=''}
burger.addEventListener('click',openNav);
document.getElementById('close').addEventListener('click',closeNav);

let current = null;
function render(){
  const key = location.hash.slice(1) || 'home';
  const p = PAGES[key] || PAGES.home;
  current?.unmount?.(); current = p;
  main.innerHTML = p.full ? p.html() : `<div class="wrap page">${p.html()}</div>`;
  document.title = p === PAGES.home ? '砂上天獄' : `${p.title} | 砂上天獄`;
  document.querySelectorAll('.menu a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+key));
  main.querySelectorAll('[data-audio]').forEach(a=>a.addEventListener('error',()=>{
    const s=document.createElement('span');s.className='na';s.textContent='試聴音声は準備中です';a.replaceWith(s);
  },{once:true}));
  loadX();
  closeNav();
  window.scrollTo(0,0);
  p.mount?.();
}
window.addEventListener('hashchange',render);

// 画像フォールバック：リポジトリに無ければWixの画像へ
document.addEventListener('error',e=>{
  const t=e.target; if(t.tagName!=='IMG'||!t.dataset.fb) return;
  const fb=t.dataset.fb; t.removeAttribute('data-fb'); t.src=fb;
},true);

const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg');
const closeLb=()=>{lb.hidden=true;lbImg.src=''};
main.addEventListener('click',e=>{const b=e.target.closest('.gallery button');if(!b)return;lbImg.src=b.querySelector('img').currentSrc;lb.hidden=false});
lb.addEventListener('click',e=>{if(e.target!==lbImg)closeLb()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLb();closeNav()}});

render();
</script>
